# Optional post-cluster reference only.
# Do not apply this during control-plane Pool / Cluster / KCP creation.
# Extra disks are mounted on the node after the cluster is Ready.
# If a later site explicitly asks for Storage v2, replace deviceID first.
storage:
  retryNonce: 0
  volumes:
    - name: extra-data
      source:
        deviceID: <actual-stable-id-of-extra-disk>
        minimumSize: 90Gi
      filesystem:
        policy: InitializeIfBlank
        type: xfs
      mount:
        path: <business-mount-path>
        required: false
        options:
          - noatime
