apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineDeployment
metadata:
  name: olvm-workloadcluster-worker-deployment
  namespace: cpaas-system
spec:
  clusterName: olvm-workloadcluster
  replicas: 3
  selector:
    matchLabels:
      cluster.x-k8s.io/deployment-name: olvm-workloadcluster-worker-deployment
  template:
    metadata:
      labels:
        cluster.x-k8s.io/deployment-name: olvm-workloadcluster-worker-deployment
    spec:
      version: v1.34.5-3
      bootstrap:
        configRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
          kind: KubeadmConfigTemplate
          name: olvm-workloadcluster-worker-kubeadm-config
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: BaremetalMachineTemplate
        name: olvm-workloadcluster-worker-machine-template
