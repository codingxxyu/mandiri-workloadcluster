apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
kind: KubeadmConfigTemplate
metadata:
  name: olvm-workloadcluster-worker-kubeadm-config
  namespace: cpaas-system
spec:
  template:
    spec:
      format: cloud-config
      users:
        - name: boot
          sshAuthorizedKeys:
            - <deployment-ssh-public-key>
      joinConfiguration:
        nodeRegistration:
          kubeletExtraArgs:
            provider-id: <ACP-4.3.2-provider-supported-value>
