# Fill remaining apply-time values after inspecting Worker MachineInventory.
# Do not commit passwords, kubeconfigs, private keys, or customer secrets.
namespace: cpaas-system
cluster_name: olvm-workloadcluster
# Values from the ACP OS support matrix for ACP v4.3.2.
acp_version: v4.3.2
kubernetes_version: v1.34.5-3
etcd_version: v3.5.28-260625
coredns_image_tag: 1.14.2-v4.3.11
architecture: linux/amd64
registry:
  address: 10.243.166.5:11443
  base_image: 10.243.166.5:11443/tkestack/baremetal-base-image:v4.3.2-1-1.34.5-3
  base_image_iso: 10.243.166.5:11443/tkestack/baremetal-base-image-iso:v4.3.2-1-1.34.5-3
network:
  api_host: 10.243.166.12
  api_port: 6443
  pods_cidr: 100.13.0.0/16
  services_cidr: 100.14.0.0/16
  kube_ovn_join_cidr: 100.15.0.0/16
  kube_ovn_version: v4.3.11
  # Cluster-wide CNI NIC. Optional in the API (default eth0). Keep it
  # explicit in BaremetalCluster.spec.networkDevice. Masters already
  # run on eth0; do not change this when Workers use VLAN 329.
  network_device: eth0
  # Per-host override lives on MachineInventoryPool.spec.machineInventories[].networkDevice.
  # Change only that host when it uses a bond or a NIC that is not eth0.
control_plane:
  replicas: 3
  registration: olvm-workloadcluster-registration
  seedimage: olvm-workloadcluster-registration-iso
  template: olvm-workloadcluster-control-plane-template
  inventories:
    - name: olvm-workloadcluster-f785380f-a4d3-4bb6-a6b1-be5c253d7a62
      hostname: olvm-workloadcluster-cpw01
      network_device: eth0
    - name: olvm-workloadcluster-2859b4f7-a97f-4f3b-a5c3-aad410030137
      hostname: olvm-workloadcluster-cpw02
      network_device: eth0
    - name: olvm-workloadcluster-d6bbbcff-a3c9-4aee-8e2b-e78eca996b12
      hostname: olvm-workloadcluster-cpw03
      network_device: eth0
  # Recommended generic path in MachineRegistration / SeedImage.
  # Do not put a host disk such as /dev/sda here. On each Live ISO,
  # symlink the real OS disk to this path, then set BMC boot to disk.
  install_device: /dev/elemental-install-target
  cos_state_size_mib: 20480
workers:
  replicas: 1
  registration: olvm-workloadcluster-worker-registration
  seedimage: olvm-workloadcluster-worker-registration-iso
  template: olvm-workloadcluster-worker-template
  # Default Worker host/CNI NIC: VLAN 329 on eth0, not a bond.
  # IP belongs on eth0.329, never on eth0. Mask/gateway/DNS from
  # the customer node sheet. 10.243.166.6 is that node's address;
  # if it is already in use, pick a free address in /26. Do not
  # use VIP 10.243.166.12.
  vlan_id: 329
  network_device: eth0.329
  gateway: 10.243.166.1
  dns: 10.243.132.38
  prefix: 26
  inventories:
    - name: <actual-worker-inventory-1>
      hostname: olvm-workloadcluster-worker01
      network_device: eth0.329
      address: 10.243.166.6/26
