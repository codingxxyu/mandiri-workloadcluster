# Official worker BaremetalMachineTemplate.
# Only the pool name is required. allocationPolicy is reserved; the
# provider currently treats every pool as Ordered.
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: BaremetalMachineTemplate
metadata:
  name: bm-cluster-worker-template
  namespace: cpaas-system
spec:
  template:
    spec:
      machineInventoryPoolRef:
        name: bm-cluster-worker-pool
