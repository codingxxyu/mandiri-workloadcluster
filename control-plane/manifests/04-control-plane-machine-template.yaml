# Control-plane BaremetalMachineTemplate. Points at bm-cluster-control-plane-pool.
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: BaremetalMachineTemplate
metadata:
  name: bm-cluster-control-plane-template
  namespace: cpaas-system
spec:
  template:
    spec:
      machineInventoryPoolRef:
        name: bm-cluster-control-plane-pool
