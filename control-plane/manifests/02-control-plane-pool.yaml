# Apply only after the three physical masters have booted the SeedImage,
# left the Live ISO, registered as MachineInventory, and are Ready=True.
# Replace machineInventories[].name with the real Master inventory names first.
# machineInventories[].networkDevice is optional. It overrides
# BaremetalCluster.spec.networkDevice for that host only. Leave it as
# eth0 when the CNI NIC matches the cluster default.
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: MachineInventoryPool
metadata:
  name: bm-cluster-control-plane-pool
  namespace: cpaas-system
spec:
  clusterName: bm-cluster
  machineInventories:
    - name: <actual-cp-inventory-1>
      hostname: bm-cluster-cp01
      networkDevice: eth0
    - name: <actual-cp-inventory-2>
      hostname: bm-cluster-cp02
      networkDevice: eth0
    - name: <actual-cp-inventory-3>
      hostname: bm-cluster-cp03
      networkDevice: eth0
